services:
  - type: web
    name: cultureconnect
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: run
      - key: JWT_SECRET
        scope: run
      - key: PORT
        value: 10000
